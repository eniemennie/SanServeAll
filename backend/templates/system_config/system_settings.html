{% extends "base.html" %}
{% block title %}System Settings - SanServeAll{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">System Settings</h1>
        <a href="{% url 'system_config:system_configuration' %}" class="btn btn-outline-secondary btn-sm">System Configuration</a>
    </div>

    {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <div class="card" style="max-width: 560px;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Business Name</label>
                    <input type="text" name="business_name" class="form-control"
                           value="{{ settings.business_name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Business Address</label>
                    <input type="text" name="business_address" class="form-control"
                           value="{{ settings.business_address }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Phone</label>
                    <input type="text" name="contact_phone" class="form-control"
                           value="{{ settings.contact_phone }}">
                </div>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label">Tax Rate (%)</label>
                        <input type="number" name="tax_rate_percent" step="0.01" min="0" class="form-control"
                               value="{{ settings.tax_rate_percent }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Currency Symbol</label>
                        <input type="text" name="currency_symbol" maxlength="5" class="form-control"
                               value="{{ settings.currency_symbol }}">
                    </div>
                </div>
                <div class="mb-3 mt-2">
                    <label class="form-label">Receipt Footer Text</label>
                    <input type="text" name="receipt_footer_text" class="form-control"
                           value="{{ settings.receipt_footer_text }}">
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
