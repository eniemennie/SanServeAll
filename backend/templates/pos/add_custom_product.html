{% extends "base.html" %}
{% block title %}Add Custom Product - SanServeAll{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 380px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Add Custom Product</h1>

            {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_name" class="form-label">Item name</label>
                    <input type="text" name="name" id="id_name" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="id_price" class="form-label">Price</label>
                    <input type="number" name="price" id="id_price" step="0.01" min="0"
                           class="form-control" required>
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'pos:ordering' %}" class="btn btn-outline-secondary w-50">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50">Add to Order</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
