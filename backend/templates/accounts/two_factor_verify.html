{% extends "base.html" %}
{% block title %}Verify - SanServeAll{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 340px; width: 100%;">
        <div class="card-body p-4 text-center">
            <h1 class="h4 mb-3">Enter Authenticator Code</h1>

            {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="text" name="token" inputmode="text"
                       maxlength="8" class="form-control form-control-lg text-center mb-3"
                       placeholder="000000" required autofocus>
                <button type="submit" class="btn btn-dark w-100">Verify</button>
            </form>
            <p class="text-muted small mt-3 mb-0">
                Lost your device? Enter one of your saved backup codes instead.
            </p>
        </div>
    </div>
</div>
{% endblock %}
