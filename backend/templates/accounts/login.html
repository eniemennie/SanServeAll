{% extends "base.html" %}
{% block title %}Login - SanServeAll{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 380px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h4 mb-1 text-center">SanServeAll</h1>
            <p class="text-muted text-center mb-4">Jorge's Casa De Sans Rival</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2">Incorrect username or password.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Log In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
